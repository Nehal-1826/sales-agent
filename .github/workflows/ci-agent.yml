# CI — catches breakage BEFORE it merges, not after.
# Backend: migrations apply + Django tests. Frontend: strict tsc + build.
name: ci

on:
  push:
    branches: [main]
    paths:
      - backend-agent/**
      - frontend/**
      - .github/workflows/ci-agent.yml
  pull_request:
    branches: [main]
    paths:
      - backend-agent/**
      - frontend/**
      - .github/workflows/ci-agent.yml

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend-agent/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
        env:
          DATABASE_URL: sqlite:///db.sqlite3
      - run: python manage.py migrate
        env:
          DATABASE_URL: sqlite:///db.sqlite3
      - run: python manage.py test
        env:
          DATABASE_URL: sqlite:///db.sqlite3
          DJANGO_SECRET_KEY: ci-only-key

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build   # tsc --noEmit (strict) + vite build + prerender
