[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "warmpulse-api"
version = "0.1.0"
description = "WarmPulse — email warmup SaaS backend (FastAPI + Celery)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "WarmPulse" }]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # Database
    "SQLAlchemy[asyncio]>=2.0.30",
    "psycopg[binary,pool]>=3.2.0",
    "alembic>=1.13.2",
    "aiosqlite>=0.20.0",  # test-only async driver, harmless in prod
    # Celery / queue
    "celery>=5.4.0",
    "packaging>=24.0",
    "redis>=5.0.7",
    # Mail I/O
    "aiosmtplib>=3.0.1",
    "aioimaplib>=1.1.0",
    # Crypto / auth
    "cryptography>=43.0.0",
    "passlib[bcrypt]>=1.7.4",
    # Pin bcrypt <4: passlib 1.7.4's backend detection crashes on bcrypt 4.x/5.x
    # ("password cannot be longer than 72 bytes"), breaking every password hash.
    "bcrypt<4.0",
    "pyjwt>=2.9.0",
    "pyotp>=2.9.0",
    # DNS / validation
    "dnspython>=2.6.1",
    "checkdmarc>=5.7.0",
    # HTTP client
    "httpx>=0.27.0",
    # Misc
    "python-multipart>=0.0.9",
    "email-validator>=2.2.0",
    # Reports — PDF rendering. reportlab ships its own charting module so we
    # don't pull in matplotlib for the inline charts.
    "reportlab>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.8",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-passlib",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # FastAPI uses Depends() as default arg
    "UP042", # (str, enum.Enum) mixin is intentional — StrEnum changes str() semantics
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E", "F", "I"]
"tests/*.py" = ["B"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "aioimaplib.*", "checkdmarc.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
