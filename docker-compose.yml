# Agentic AI — production stack for a Linux VPS.
#
#   frontend (nginx)  →  api (gunicorn)  →  db (postgres)
#                            ↑
#                 worker (agent scheduler, daily report)
#
# Everything restarts automatically: `restart: unless-stopped` brings each
# service back if it crashes AND after a VPS reboot. Data persists in the
# `pgdata` docker volume.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentic}
      POSTGRES_USER: ${POSTGRES_USER:-agentic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentic} -d ${POSTGRES_DB:-agentic}"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-agentic}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agentic}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      ROLE: worker
      DATABASE_URL: postgres://${POSTGRES_USER:-agentic}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agentic}
    depends_on:
      db:
        condition: service_healthy
    # No ports — the worker is internal; it stamps heartbeats the api reports.

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"        # dashboard at http://VPS_IP
    depends_on:
      - api

volumes:
  pgdata:
