server {
    listen 8088;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Prefer build-time precompressed assets (vite-plugin-compression emits
    # .br and .gz next to every asset). gzip_static ships in the official
    # nginx image; brotli_static only if the module is present — guarded so the
    # config still loads on a stock nginx build.
    gzip_static on;
    # brotli_static on;  # enable if the nginx build includes ngx_brotli

    # Fallback on-the-fly gzip for anything without a precompressed sibling.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml application/xml+rss
        application/wasm font/woff2 image/svg+xml;

    client_max_body_size 10M;

    # API → backend on host. The /health and /openapi.json mounts are bare on
    # the FastAPI app (no /api prefix) — expose them so smoke.sh hits the real
    # backend instead of the SPA fallback returning index.html with HTTP 200.
    location = /health {
        proxy_pass http://127.0.0.1:8001/health;
    }
    location = /openapi.json {
        proxy_pass http://127.0.0.1:8001/openapi.json;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    300s;
        proxy_buffering off;
    }

    # Version manifest for the in-app / on-site "update available" prompt.
    # JSON, never cached, so a new release is seen immediately by old clients.
    location = /downloads/version.json {
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # Mobile app APK (bind-mounted from ./frontend/downloads). Force the
    # Android package mime type + attachment so every browser downloads it
    # rather than trying to render it. 404 cleanly if the build isn't present.
    location /downloads/ {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # Long-cache hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback. COOP must allow popups so Firebase signInWithPopup
    # can detect window.closed on the OAuth popup.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Embedder-Policy "unsafe-none" always;
        try_files $uri $uri/ /index.html;
    }
}
