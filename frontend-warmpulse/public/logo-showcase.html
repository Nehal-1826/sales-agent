<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WarmPulse Logo - High Resolution</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a26 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            padding: 40px;
        }
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 60px;
            background: rgba(26, 26, 38, 0.5);
            border-radius: 30px;
            border: 1px solid rgba(255, 107, 53, 0.2);
            box-shadow: 0 20px 60px rgba(255, 107, 53, 0.15);
        }
        .logo-svg {
            width: 256px;
            height: 256px;
            filter: drop-shadow(0 10px 30px rgba(255, 107, 53, 0.3));
        }
        .brand-name {
            font-family: 'Outfit', sans-serif;
            font-size: 64px;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(90deg, #ffffff 0%, #FFB347 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
        }
        .tagline {
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        .download-section {
            margin-top: 40px;
            display: flex;
            gap: 20px;
        }
        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }
        .btn-primary {
            background: linear-gradient(90deg, #FF6B35, #FF8E53);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.4);
        }
        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.5);
        }
        .info {
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            text-align: center;
        }
        @media print {
            body {
                background: white;
            }
            .logo-container {
                box-shadow: none;
                border: 1px solid #ddd;
            }
            .download-section {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <svg class="logo-svg" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="warm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#FF6B35"/>
                    <stop offset="50%" stop-color="#FF8E53"/>
                    <stop offset="100%" stop-color="#FFB347"/>
                </linearGradient>
                <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.3"/>
                    <stop offset="100%" stop-color="#FFB347" stop-opacity="0.1"/>
                </linearGradient>
                <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#1a1a26"/>
                    <stop offset="100%" stop-color="#0a0a0f"/>
                </radialGradient>
            </defs>
            <rect width="512" height="512" rx="80" fill="url(#bg-glow)"/>
            <rect x="56" y="56" width="400" height="400" rx="60" fill="url(#glow-grad)"/>
            <g transform="translate(128, 128)">
                <rect x="20" y="40" width="216" height="144" rx="16" fill="none" stroke="url(#warm-grad)" stroke-width="8"/>
                <path d="M20 40 L128 120 L236 40" fill="none" stroke="url(#warm-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                <rect x="20" y="100" width="216" height="84" rx="12" fill="url(#warm-grad)" fill-opacity="0.1"/>
                <line x1="20" y1="100" x2="236" y2="100" stroke="url(#warm-grad)" stroke-width="8" stroke-linecap="round"/>
                <g opacity="0.8">
                    <path d="M56 180 Q80 160 104 180" stroke="url(#warm-grad)" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <path d="M72 200 Q100 175 128 200" stroke="url(#warm-grad)" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <path d="M88 220 Q120 190 152 220" stroke="url(#warm-grad)" stroke-width="2" fill="none" stroke-linecap="round"/>
                </g>
                <g fill="url(#warm-grad)">
                    <circle cx="200" cy="60" r="6" opacity="0.8"/>
                    <circle cx="180" cy="45" r="4" opacity="0.6"/>
                    <circle cx="215" cy="50" r="3" opacity="0.7"/>
                    <circle cx="190" cy="30" r="5" opacity="0.5"/>
                </g>
            </g>
            <rect x="176" y="420" width="160" height="8" rx="4" fill="url(#warm-grad)" opacity="0.6"/>
        </svg>
        <div class="brand-name">WarmPulse</div>
        <div class="tagline">Email Warmup Platform</div>
    </div>
    <div class="download-section">
        <button class="btn btn-primary" onclick="window.print()">Download / Print Logo</button>
    </div>
    <div class="info">High-resolution logo • 512x512px • SVG + PNG formats</div>
</body>
</html>
