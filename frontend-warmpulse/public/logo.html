<!DOCTYPE html>
<html>
<head>
    <title>WarmPulse Logo</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a26 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .logo-container {
            text-align: center;
        }
        svg {
            max-width: 400px;
            height: auto;
        }
        .text {
            margin-top: 30px;
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(90deg, #ffffff 0%, #FF6B35 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="400" height="400">
            <defs>
                <linearGradient id="warm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#FF6B35"/>
                    <stop offset="50%" stop-color="#FF8E53"/>
                    <stop offset="100%" stop-color="#FFB347"/>
                </linearGradient>
                <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.3"/>
                    <stop offset="100%" stop-color="#FFB347" stop-opacity="0.1"/>
                </linearGradient>
                <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#1a1a26"/>
                    <stop offset="100%" stop-color="#0a0a0f"/>
                </radialGradient>
            </defs>
            <rect width="512" height="512" rx="80" fill="url(#bg-glow)"/>
            <rect x="56" y="56" width="400" height="400" rx="60" fill="url(#glow-grad)"/>
            <g transform="translate(128, 128)">
                <rect width="256" height="180" rx="20" fill="url(#warm-grad)"/>
                <path d="M0 20 Q128 100 256 20 L256 0 L0 0 Z" fill="#FF8E53"/>
                <path d="M0 160 Q128 80 256 160 L256 180 L0 180 Z" fill="#FF8E53"/>
                <circle cx="200" cy="100" r="25" fill="#FFB347" opacity="0.8">
                    <animate attributeName="r" values="25;35;25" dur="2s" repeatCount="indefinite"/>
                    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
                </circle>
                <circle cx="200" cy="100" r="15" fill="#ffffff">
                    <animate attributeName="r" values="15;20;15" dur="2s" repeatCount="indefinite" begin="0.3s"/>
                    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" begin="0.3s"/>
                </circle>
            </g>
        </svg>
        <div class="text">WarmPulse</div>
    </div>
</body>
</html>
