<!DOCTYPE html>
<html>
<head>
    <title>WarmPulse Logo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0f;
            font-family: 'Outfit', sans-serif;
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 40px;
        }
        .logo-icon {
            width: 64px;
            height: 64px;
        }
        .logo-text {
            font-family: 'Outfit', sans-serif;
            font-size: 48px;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(90deg, #ffffff 0%, #FFB890 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .download-btn {
            position: fixed;
            bottom: 30px;
            padding: 15px 30px;
            background: linear-gradient(90deg, #F26522, #FF8A4B);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(242, 101, 34, 0.4);
        }
        .download-btn:hover {
            transform: scale(1.05);
        }
        .info {
            position: fixed;
            bottom: 80px;
            color: #8888a0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <svg class="logo-icon" viewBox="0 0 64 64" fill="none">
            <defs>
                <linearGradient id="wp-grad" x1="0" y1="0" x2="64" y2="64">
                    <stop offset="0%" stop-color="#F26522"/>
                    <stop offset="100%" stop-color="#FF9670"/>
                </linearGradient>
                <radialGradient id="wp-glow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#F26522" stop-opacity="0.35"/>
                    <stop offset="100%" stop-color="#F26522" stop-opacity="0"/>
                </radialGradient>
            </defs>
            <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#wp-glow)" opacity="0.6"/>
            <g stroke="url(#wp-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
                <rect x="14" y="20" width="36" height="24" rx="3"/>
                <path d="M14 22 L32 34 L50 22"/>
            </g>
            <path d="M8 50 L20 50 L24 44 L30 56 L36 42 L42 52 L46 50 L56 50" stroke="url(#wp-grad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="6 4"/>
            <circle cx="32" cy="49" r="2.4" fill="#F26522"/>
        </svg>
        <div class="logo-text">WarmPulse</div>
    </div>
    <div class="info">Right-click and save, or use browser print → save as PDF</div>
    <button class="download-btn" onclick="window.print()">Download / Print Logo</button>
</body>
</html>
