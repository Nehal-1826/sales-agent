# nginx for the Agentic AI frontend.
# Serves the built React app and proxies backend routes to the api container —
# so the browser only ever talks to one origin (no CORS, HTTP or HTTPS).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Backend API — path is preserved (/api/... reaches Django as /api/...)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # a Run cycle can take minutes
    }

    # Django admin + its static assets
    location /admin/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Single-page app — every unknown path serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
