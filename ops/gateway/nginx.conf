# Forward the edge proxy's scheme (Caddy sets X-Forwarded-Proto: https in the
# docker-compose.https.yml overlay); when the gateway is hit directly over
# plain HTTP, fall back to its own $scheme. A bare `$scheme` would always be
# `http` here — Caddy → gateway is plain HTTP inside the docker network — and
# would clobber the real client scheme Django/FastAPI need to see.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;

  client_max_body_size 10M;

  # Frontend SPA (prerendered build) + Django /admin/ & /static/
  location / {
    proxy_pass http://frontend:80/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # Legacy/external FastAPI paths kept at /api/... (Google/Microsoft OAuth
  # redirect URIs, Julex storefront status check, CRM tracking/logo pixels).
  # Django has no routes under these prefixes.
  location /api/auth/google/ {
    proxy_pass http://fastapi:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }
  location /api/auth/microsoft/ {
    proxy_pass http://fastapi:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }
  location /api/integrations/julex/ {
    proxy_pass http://fastapi:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }
  location /api/crm/public/ {
    proxy_pass http://fastapi:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # Django agent API
  location /api/ {
    proxy_pass http://django:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 300s;
  }

  # WarmPulse FastAPI: /wp-api/x  ->  FastAPI /api/x  (strip + internal prefix)
  location /wp-api/api/ {
    proxy_pass http://fastapi:8001/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Prefix /wp-api;
  }
  # any other /wp-api/* path (e.g. /wp-api/health) maps to FastAPI root path
  location /wp-api/ {
    proxy_pass http://fastapi:8001/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Prefix /wp-api;
  }

  # FastAPI docs (/docs, /redoc, /openapi.json) used to be proxied here for
  # platform admins. Removed: the app itself serves them only when APP_ENV
  # is development/test (config.docs_enabled), so in production this block
  # was a dead pass-through to FastAPI's 404. To use the docs, run the stack
  # with a dev APP_ENV and hit FastAPI directly on :8001.
}
