# =============================================================================
# WarmPulse — Nginx server-block snippet
# -----------------------------------------------------------------------------
# This file is intended to be *included* inside the main Nginx `server { ... }`
# block on the Hostinger VPS shared with SashaLMS. SashaLMS retains its own
# routes (sasha-api on 127.0.0.1:8000); this file only adds `/warmpulse/*`
# locations (frontend static SPA + FastAPI proxy on 127.0.0.1:8001).
#
# Include example (inside the existing `server { listen 443 ssl; ... }`):
#     include /etc/nginx/snippets/warmpulse.conf;
#
# After editing:  sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# ----- gzip: compress text-ish responses at the edge -------------------------
# `gzip on` is usually set in nginx.conf globally, but we re-declare the types
# here defensively so this snippet is self-contained.
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 5;
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml;

# ----- request body size (10 MB — sized for CSV lead imports) ----------------
client_max_body_size 10M;

# =============================================================================
# MAINTENANCE MODE (nginx-level — survives API/frontend rebuilds)
# -----------------------------------------------------------------------------
# Controlled by a flag file: /var/www/warmpulse/maintenance.on
#   touch /var/www/warmpulse/maintenance.on   → site shows the maintenance page
#   rm    /var/www/warmpulse/maintenance.on   → site back to normal
# No nginx reload needed — `if (-f …)` is evaluated per request.
#
# The admin toggle (Admin → Settings → Danger Zone) writes the same file via
# MAINTENANCE_FLAG_PATH, and ops/maintenance.sh drives it from the shell for
# deploy windows when the API itself is being rebuilt.
#
# /warmpulse/api/admin/ is deliberately UNGATED (longest-prefix match wins)
# so a super_admin can still reach the API to toggle maintenance off — and
# /warmpulse/maintenance.html itself must stay reachable for the 503 redirect.
# =============================================================================
error_page 503 /warmpulse/maintenance.html;

location = /warmpulse/maintenance.html {
    root /var/www;
    access_log off;
}

location /warmpulse/api/admin/ {
    # Ungated admin passthrough (see block above) — same proxy settings as
    # the general API location below.
    proxy_pass http://127.0.0.1:8001/;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Prefix /warmpulse/api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    300s;
    proxy_buffering off;
}

# ----- upgrade map for WebSocket (referenced by the /warmpulse/api/ block) ---
# Nginx needs a `map` defined in the `http { }` context to resolve
# $connection_upgrade. If you haven't added it to nginx.conf yet, put this in
# /etc/nginx/conf.d/websocket_upgrade.conf:
#
#     map $http_upgrade $connection_upgrade {
#         default upgrade;
#         ''      close;
#     }
#
# (Declaring `map` inside a `server {}` block is invalid Nginx — it lives in
# the `http` context — so we only document it here.)

# =============================================================================
# /warmpulse/api/  →  FastAPI (Uvicorn) on 127.0.0.1:8001
# -----------------------------------------------------------------------------
# The trailing slash on both `location` and `proxy_pass` strips the
# `/warmpulse/api/` prefix before forwarding to the upstream — FastAPI sees
# paths like `/health`, `/auth/login`, etc., matching the app's router
# definitions. APP_BASE_URL in the env file should reflect the public prefix.
# =============================================================================
location /warmpulse/api/ {
    # Maintenance gate — flag file checked per request (no reload needed).
    if (-f /var/www/warmpulse/maintenance.on) {
        return 503;
    }

    proxy_pass http://127.0.0.1:8001/;

    # Preserve the originating request metadata for logging, rate limiting,
    # OAuth redirect URI building, and same-origin cookie scoping.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Prefix /warmpulse/api;

    # WebSocket upgrade plumbing — required for the planned live warmup feed
    # (see spec §11). The `map $http_upgrade $connection_upgrade` directive
    # must exist in the http{} context; see note above.
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Reasonable timeouts: SMTP/IMAP probes and peer inbox actions can be
    # slow; LLM-backed endpoints are routed to the zai worker (not here) but
    # we still allow generous read timeouts for streaming endpoints.
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    300s;

    # Do not let Nginx buffer streaming responses (SSE / live feed).
    proxy_buffering off;
}

# =============================================================================
# /warmpulse/  →  React SPA (Vite build output)
# -----------------------------------------------------------------------------
# `alias` (not `root`) lets us map the URL prefix onto a directory that does
# NOT contain a literal `warmpulse/` segment. `try_files` implements the SPA
# fallback: serve the real file if it exists, otherwise hand back index.html
# and let React Router handle the path.
# =============================================================================
location /warmpulse/ {
    # Maintenance gate — SPA swaps to the static maintenance page.
    if (-f /var/www/warmpulse/maintenance.on) {
        return 503;
    }

    alias /var/www/warmpulse/frontend/dist/;
    try_files $uri $uri/ /warmpulse/index.html;

    # Long-cache hashed static assets (Vite emits content-hashed filenames
    # under /assets/). HTML itself is handled by the fallback above and kept
    # uncached so deploys propagate immediately.
    location ~* ^/warmpulse/assets/.*\.(?:js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        alias /var/www/warmpulse/frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
